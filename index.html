<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | KHOTJIPANG & RAMYEON</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Flaticon Uicons -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">



</head>

<body>

    <main class="home-container">

        <!-- LOGO -->
        <div class="logo-box">

            <img
                src="images/logo.png"
                alt="KHOTJIPANG & RAMYEON">

        </div>


        <!-- SHOP NAME -->
        <div class="shop-name">

            <h1>KHOTJIPANG</h1>

            <h2>& RAMYEON</h2>

        </div>


        <!-- CUSTOMER LOGIN -->
        <div class="customer-login">

            <div class="input-group">

                <label for="customerName">
                    ชื่อเล่น
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="เช่น โคตรจิปัง"
                    maxlength="50"
                    autocomplete="name">

            </div>


            <div class="input-group">

                <label for="customerPhone">
                    เบอร์โทรศัพท์
                </label>

                <input
                    type="tel"
                    id="customerPhone"
                    placeholder="0xxxxxxxxx"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel">

            </div>


            <button
                id="orderButton"
                class="order-button">

                เข้าสู่ระบบ / สั่งอาหาร

            </button>


            <p class="location-info">

                <i class="fi fi-rr-map-location-track" id="map"></i> สำหรับลูกค้าที่อยู่ในระยะไม่เกิน 5 กม.

            </p>


            <div
                id="statusMessage"
                class="status-message">
            </div>

        </div>

    </main>


    <script src="js/location.js"></script>

</body>

</html>
